# Supported build surfaces (see README "Supported Surfaces"):
#   - WASM component: cargo component build -p wawk-wasi --release --target wasm32-wasip2 (make wasi)
#   - Host tests:     cargo test --workspace --target x86_64-unknown-linux-gnu
# Default target is wasm32-wasip2 because the wawk-wasi lib crate is
# crate-type=["cdylib"] and wit-bindgen 0.42 legacy export names
# (wasi:cli/run@0.2.6#run) break the ELF linker version script on native
# targets. Same disease class as the extension repos, solved via per-repo config.
[build]
target = "wasm32-wasip2"
