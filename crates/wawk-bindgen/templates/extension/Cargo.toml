[package]
name = "wawk-EXTENSIONNAME"
description = "wawk extension: EXTENSION_DESCRIPTION"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.42.0"
serde_json = "1"

[dev-dependencies]
# Add test dependencies here

# cargo-component target: generates a WASM component for the `wawk-extension`
# world (export wawk:extensions/extension-functions). Extensions that also handle
# document formats should switch the world to `wawk-extension-with-format` and
# implement the extension-formats interface.
[package.metadata.component]
package = "wawk:extensions"

[package.metadata.component.target]
path = "wit"
world = "wawk-extension"

# Keep a generated extension as its own workspace so it builds standalone.
[workspace]
