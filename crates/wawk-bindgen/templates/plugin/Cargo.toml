[package]
name = "wawk-PLUGINNAME"
description = "wawk plugin: PLUGIN_DESCRIPTION"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.42.0"
serde_json = "1"

[dev-dependencies]
# Add test dependencies here

# cargo-component target: generates a WASM component for the `wawk-plugin`
# world (export wawk:plugins/external-functions). Plugins that also handle
# document formats should switch the world to `wawk-plugin-with-format` and
# implement the format-handler interface.
[package.metadata.component]
package = "wawk:plugins"

[package.metadata.component.target]
path = "wit"
world = "wawk-plugin"

# Keep a generated plugin as its own workspace so it builds standalone.
[workspace]
