[package]
name = "wawk-codegen"
description = "Dispatcher codegen tool — reads plugin-manifest.json and generates WIT + Rust dispatcher source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
keywords = ["awk", "wasm", "codegen", "dispatcher"]
categories = ["wasm", "development-tools"]
repository = "https://github.com/ailurlabs/wawk-rs"

[[bin]]
name = "wawk-codegen"
path = "src/main.rs"

[lib]
name = "wawk_codegen"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
