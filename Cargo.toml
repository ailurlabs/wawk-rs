[workspace]
resolver = "2"
members = [
    "crates/wawk-core",
    "crates/wawk-wasi",
    "crates/wawk-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
wawk-core = { path = "crates/wawk-core" }

# External dependencies
nom = { version = "7", default-features = false, features = ["std"] }
thiserror = "1"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

# Size-optimize third-party deps (smaller binary, faster startup);
# workspace crates keep opt-level 3 for hot-path speed.
[profile.release.package."*"]
opt-level = "s"
